<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
		<title>Medical Chatbot</title>
		<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
		<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.5.0/css/all.css" integrity="sha384-B4dIYHKNBt8Bc12p+WXckhzcICo0wtJAoU8YZTY5qE0Id1GSseTk6S+L3BlXeVIU" crossorigin="anonymous">
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
		<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}"/>
	</head>
	
	<body>
		<div class="container-fluid h-100">
			<div class="row justify-content-center h-100">		
				<div class="col-md-8 col-xl-6 chat">
					<div class="card">
						<div class="card-header msg_head">
							<div class="d-flex bd-highlight">
								<div class="img_cont">
									<img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" onerror="this.onerror=null;this.src='https://raw.githubusercontent.com/FortAwesome/Font-Awesome/master/svgs/solid/user-md.svg';" class="rounded-circle user_img" alt="Bot">
									<span class="online_icon"></span>
								</div>
								<div class="user_info">
									<span>Medical Chatbot</span>
									<p>Ask me any medical question!</p>
								</div>
							</div>
						</div>
						<div id="messageFormeight" class="card-body msg_card_body">
							<div class="d-flex justify-content-start mb-4">
								<div class="img_cont_msg">
									<img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" onerror="this.onerror=null;this.src='https://raw.githubusercontent.com/FortAwesome/Font-Awesome/master/svgs/solid/user-md.svg';" class="rounded-circle user_img_msg" alt="Bot">
								</div>
								<div class="msg_cotainer">
									Hello! I am your AI Medical Assistant. How can I help you today?
									<span class="msg_time">Online</span>
								</div>
							</div>
						</div>
						<div class="card-footer">
							<form id="messageArea" class="input-group">
								<input type="text" id="text" name="msg" placeholder="Type your medical query here..." autocomplete="off" class="form-control type_msg" required/>
								<div class="input-group-append">
									<button type="submit" id="send" class="input-group-text send_btn"><i class="fas fa-location-arrow"></i></button>
								</div>
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>
		
		<script>
			function scrollToBottom() {
				var msgContainer = document.getElementById("messageFormeight");
				msgContainer.scrollTop = msgContainer.scrollHeight;
			}

			$(document).ready(function() {
				scrollToBottom();

				$("#messageArea").on("submit", function(event) {
					event.preventDefault();
					const date = new Date();
					const hour = String(date.getHours()).padStart(2, '0');
					const minute = String(date.getMinutes()).padStart(2, '0');
					const str_time = hour + ":" + minute;
					var rawText = $("#text").val().trim();
					if (!rawText) return;

					var userHtml = '<div class="d-flex justify-content-end mb-4"><div class="msg_cotainer_send">' + 
						$('<div>').text(rawText).html() + 
						'<span class="msg_time_send">' + str_time + '</span></div><div class="img_cont_msg"><img src="https://raw.githubusercontent.com/FortAwesome/Font-Awesome/master/svgs/solid/user.svg" class="rounded-circle user_img_msg" alt="User"></div></div>';
					
					$("#text").val("");
					$("#messageFormeight").append(userHtml);
					scrollToBottom();

					// Add loading indicator
					var loadingId = "loading_" + Date.now();
					var loadingHtml = '<div id="' + loadingId + '" class="d-flex justify-content-start mb-4"><div class="img_cont_msg"><img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" onerror="this.onerror=null;this.src=\'https://raw.githubusercontent.com/FortAwesome/Font-Awesome/master/svgs/solid/user-md.svg\';" class="rounded-circle user_img_msg"></div><div class="msg_cotainer"><em>Thinking...</em></div></div>';
					$("#messageFormeight").append(loadingHtml);
					scrollToBottom();

					$.ajax({
						data: {
							msg: rawText,	
						},
						type: "POST",
						url: "/get",
					}).done(function(data) {
						$("#" + loadingId).remove();
						var botHtml = '<div class="d-flex justify-content-start mb-4"><div class="img_cont_msg"><img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" onerror="this.onerror=null;this.src=\'https://raw.githubusercontent.com/FortAwesome/Font-Awesome/master/svgs/solid/user-md.svg\';" class="rounded-circle user_img_msg"></div><div class="msg_cotainer">' + data + '<span class="msg_time">' + str_time + '</span></div></div>';
						$("#messageFormeight").append(botHtml);
						scrollToBottom();
					}).fail(function(xhr, status, error) {
						$("#" + loadingId).remove();
						var botHtml = '<div class="d-flex justify-content-start mb-4"><div class="img_cont_msg"><img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" onerror="this.onerror=null;this.src=\'https://raw.githubusercontent.com/FortAwesome/Font-Awesome/master/svgs/solid/user-md.svg\';" class="rounded-circle user_img_msg"></div><div class="msg_cotainer text-warning">Could not reach the server. Please try again.</div></div>';
						$("#messageFormeight").append(botHtml);
						scrollToBottom();
					});
				});
			});
		</script>
	</body>
</html>
